<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Diaa Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #0f172a;
  color: white;
  text-align: center;
  font-family: Arial;
  padding: 20px;
}

textarea {
  width: 90%;
  height: 100px;
  border-radius: 10px;
  padding: 10px;
  font-size: 16px;
}

button {
  margin: 10px;
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  color: white;
  cursor: pointer;
}

canvas {
  margin-top: 20px;
  background: white;
  border-radius: 20px;
}

.emoji {
  font-size: 24px;
  cursor: pointer;
  margin: 5px;
}
</style>
</head>

<body>

<h2>✨ اكتب وحوّل لصورة</h2>

<textarea id="text"></textarea>

<div>
  <span class="emoji" onclick="addEmoji('😂')">😂</span>
  <span class="emoji" onclick="addEmoji('❤️')">❤️</span>
  <span class="emoji" onclick="addEmoji('🔥')">🔥</span>
  <span class="emoji" onclick="addEmoji('😎')">😎</span>
</div>

<br>

<button onclick="generate()">عرض</button>
<button onclick="download()">تحميل PNG</button>

<canvas id="canvas" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function addEmoji(e) {
  document.getElementById("text").value += e;
}

function generate() {
  const text = document.getElementById("text").value;

  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,400,400);

  ctx.fillStyle = "#000";
  ctx.font = "24px Arial";

  let lines = text.split("\n");
  let y = 50;

  lines.forEach(line => {
    ctx.fillText(line, 20, y);
    y += 30;
  });
}

function download() {
  let link = document.createElement("a");
  link.download = "diaa.png";
  link.href = canvas.toDataURL();
  link.click();
}
</script>

</body>
</html>
